<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>液态晨露 · QT新月实验室</title>
<style>
  :root {
    --dew-bg:#F4F7F0; --dew-mint:#E7F1E6; --dew-leaf:#C7DDCB;
    --dew-sage:#8EAF99; --dew-forest:#385F4C;
    --dew-text:#304B3E; --dew-muted:#7F9787;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(120vmax 90vmax at 85% -10%, rgba(255,255,255,.75), transparent 55%),
      radial-gradient(90vmax 70vmax at -10% 110%, rgba(199,221,203,.5), transparent 60%),
      linear-gradient(165deg, var(--dew-bg) 0%, var(--dew-mint) 45%, var(--dew-leaf) 130%);
    color:var(--dew-text); overflow-x:hidden; min-height:100%;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- 背景：叶片露珠 + 水面 ---------- */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .b1 { width:46vmax; height:46vmax; left:-10vmax; top:-12vmax;
    background:radial-gradient(circle, #d9efdf, transparent 65%);
    animation:drift1 26s ease-in-out infinite alternate; }
  .b2 { width:38vmax; height:38vmax; right:-8vmax; top:30vh;
    background:radial-gradient(circle, #c2e2cc, transparent 65%);
    animation:drift2 34s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(5vmax,4vmax) scale(1.1); } }
  @keyframes drift2 { to { transform:translate(-4vmax,-5vmax) scale(1.07); } }
  .leaf { position:absolute; border-radius:62% 38% 55% 45% / 48% 55% 45% 52%;
    background:linear-gradient(135deg, rgba(142,175,153,.28), rgba(56,95,76,.16));
    filter:blur(2px); }
  .l1 { width:34vmax; height:20vmax; left:-6vmax; bottom:6vh; transform:rotate(-18deg); }
  .l2 { width:26vmax; height:15vmax; right:-4vmax; top:8vh; transform:rotate(14deg); }

  /* ---------- 液态水滴导航 ---------- */
  .dew-nav { position:fixed; top:max(14px, env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); z-index:50; display:flex; gap:10px;
    padding:10px 14px; align-items:center; max-width:96vw; }
  .dew-drop {
    --r1:58% 42% 55% 45%; --r2:46% 54% 44% 56%;
    position:relative; border:none; cursor:pointer; flex:0 0 auto;
    padding:10px 18px; font-size:14px; font-weight:600; color:var(--dew-forest);
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.12) 26%, transparent 45%),
      radial-gradient(circle at 50% 55%, rgba(231,241,230,.72) 0%, rgba(199,221,203,.55) 60%, rgba(142,175,153,.5) 100%);
    border-radius:var(--r1) / var(--r2);
    box-shadow:
      inset 2px 3px 8px rgba(255,255,255,.7),
      inset -4px -6px 12px rgba(56,95,76,.22),
      0 8px 22px rgba(56,95,76,.18),
      0 2px 6px rgba(56,95,76,.12);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s, background .22s;
    white-space:nowrap;
  }
  .dew-drop::before { /* 顶部环境反射 */
    content:''; position:absolute; left:24%; top:10%; width:30%; height:16%;
    border-radius:50%; background:linear-gradient(180deg, rgba(255,255,255,.85), transparent);
    filter:blur(1px); pointer-events:none;
  }
  .dew-drop:hover { transform:scale(1.04); box-shadow:
      inset 2px 3px 8px rgba(255,255,255,.85),
      inset -4px -6px 12px rgba(56,95,76,.22),
      0 12px 28px rgba(56,95,76,.24), 0 2px 6px rgba(56,95,76,.12); }
  .dew-drop:active { transform:scale(.93); transition-duration:.12s; }
  .dew-drop.active {
    color:#fff; background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.75) 0%, transparent 40%),
      radial-gradient(circle at 50% 55%, rgba(90,140,110,.95) 0%, rgba(56,95,76,.95) 100%);
    transform:scale(1.06);
    box-shadow: inset 2px 3px 10px rgba(255,255,255,.5),
      0 10px 26px rgba(56,95,76,.35);
  }
  .dew-drop .tip { position:absolute; left:50%; top:-7px; width:14px; height:14px;
    transform:translateX(-50%) rotate(45deg); border-radius:4px 50% 50% 50%;
    background:inherit; filter:brightness(1.04); z-index:-1; }

  /* ---------- Hero ---------- */
  .hero { position:relative; z-index:5; text-align:center; padding:120px 20px 30px; }
  .hero h1 { font-size:clamp(2rem, 6vw, 3.4rem); color:var(--dew-forest);
    letter-spacing:.06em; animation:fadeUp .9s ease both; }
  .hero h1 .en { display:block; font-size:.42em; letter-spacing:.34em;
    color:var(--dew-sage); margin-top:10px; font-weight:500; }
  .hero p { margin-top:14px; color:var(--dew-muted); font-size:15px;
    animation:fadeUp .9s .15s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } }
  .float-drop { position:absolute; width:54px; height:54px; border-radius:58% 42% 55% 45% / 46% 54% 44% 56%;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), rgba(199,221,203,.4) 55%, rgba(142,175,153,.5));
    box-shadow:inset 2px 3px 8px rgba(255,255,255,.8), 0 10px 24px rgba(56,95,76,.25);
    animation:hover 5s ease-in-out infinite; }
  @keyframes hover { 0%,100% { transform:translateY(-8px); } 50% { transform:translateY(10px); } }

  /* ---------- 游乐场 ---------- */
  .play { position:relative; z-index:5; margin:26px auto 0; max-width:1060px;
    padding:0 20px; }
  .play-head { display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:12px; }
  .play-head h2 { font-size:1.15rem; color:var(--dew-forest); letter-spacing:.08em; }
  .play-head span { font-size:12px; color:var(--dew-muted); }
  #pond { position:relative; width:100%; height:min(58vh, 480px); border-radius:28px;
    overflow:hidden; cursor:crosshair;
    background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(231,241,230,.15)),
      radial-gradient(80% 60% at 50% 110%, rgba(142,175,153,.35), transparent 70%);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 2px 18px rgba(255,255,255,.5), 0 18px 44px rgba(56,95,76,.14); }
  .ripple { position:absolute; border:2px solid rgba(142,175,153,.55); border-radius:50%;
    transform:translate(-50%,-50%); pointer-events:none; animation:ripple 1.1s ease-out forwards; }
  @keyframes ripple { from { width:8px; height:8px; opacity:.9; } to { width:150px; height:150px; opacity:0; } }
  .spawn { position:absolute; transform:translate(-50%,-50%); border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.15) 24%, transparent 48%),
      radial-gradient(circle at 50% 55%, rgba(231,241,230,.8) 0%, rgba(142,175,153,.55) 100%);
    box-shadow:inset 2px 3px 8px rgba(255,255,255,.7), 0 8px 20px rgba(56,95,76,.25);
    animation:spawnPop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes spawnPop { from { scale:.2; opacity:0; } }

  /* ---------- Tokens ---------- */
  .tokens { position:relative; z-index:5; max-width:1060px; margin:34px auto 0; padding:0 20px; }
  .tokens h2 { font-size:1.15rem; color:var(--dew-forest); letter-spacing:.08em; margin-bottom:12px; }
  .token-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; }
  .token { border-radius:16px; padding:12px; background:rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.7); box-shadow:0 6px 18px rgba(56,95,76,.1); }
  .token i { display:block; height:44px; border-radius:10px; margin-bottom:8px; }
  .token b { font-size:12px; display:block; color:var(--dew-forest); }
  .token span { font-size:11px; color:var(--dew-muted); font-family:ui-monospace,monospace; }

  /* ---------- 右下角露珠个人卡 ---------- */
  .dew-card {
    position:fixed; right:18px; bottom:18px; z-index:60; width:290px;
    border-radius:38% 42% 34% 40% / 30px; padding:22px 20px 18px;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,.85) 0%, transparent 38%),
      linear-gradient(150deg, rgba(255,255,255,.62), rgba(231,241,230,.42) 60%, rgba(199,221,203,.5));
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
      inset 3px 5px 14px rgba(255,255,255,.65),
      inset -6px -9px 18px rgba(56,95,76,.16),
      0 18px 44px rgba(56,95,76,.22), 0 3px 10px rgba(56,95,76,.14);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    animation:cardIn .8s cubic-bezier(.34,1.4,.64,1) both;
  }
  @keyframes cardIn { from { opacity:0; transform:translateY(26px) scale(.94); } }
  .dew-card .who { display:flex; gap:12px; align-items:center; }
  .avatar { width:52px; height:52px; flex:0 0 auto; border-radius:56% 44% 52% 48% / 48% 54% 46% 52%;
    background:radial-gradient(circle at 32% 28%, #fff, var(--dew-leaf) 60%, var(--dew-sage));
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:inset 2px 3px 6px rgba(255,255,255,.8), 0 6px 14px rgba(56,95,76,.2); }
  .dew-card h3 { font-size:16px; color:var(--dew-forest); }
  .dew-card .role { font-size:12px; color:var(--dew-muted); margin-top:3px; }
  .dew-card .bio { font-size:13px; line-height:1.75; color:var(--dew-text); margin-top:10px; }
  .dew-card .stats { display:flex; gap:8px; margin-top:12px; }
  .dew-card .stat { flex:1; text-align:center; background:rgba(255,255,255,.45);
    border-radius:12px; padding:8px 4px; }
  .dew-card .stat b { display:block; font-size:16px; color:var(--dew-forest); }
  .dew-card .stat span { font-size:10px; color:var(--dew-muted); }

  .back { position:fixed; left:16px; bottom:16px; z-index:60; font-size:13px;
    color:var(--dew-forest); text-decoration:none; padding:9px 16px; border-radius:999px;
    background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.7);
    backdrop-filter:blur(6px); }
  .hint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:5;
    font-size:12px; color:var(--dew-muted); }

  @media (max-width:768px) {
    .dew-nav { gap:6px; padding:8px 10px; overflow-x:auto; scrollbar-width:none; }
    .dew-nav::-webkit-scrollbar { display:none; }
    .dew-drop { padding:8px 13px; font-size:12.5px; }
    .dew-card { left:12px; right:12px; width:auto; bottom:12px; }
    .hint { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="leaf l1"></div><div class="leaf l2"></div>
</div>

<nav class="dew-nav" aria-label="液态水滴导航演示" id="dewNav"></nav>

<header class="hero">
  <div class="float-drop" style="left:12%; top:150px;" aria-hidden="true"></div>
  <div class="float-drop" style="right:10%; top:210px; width:38px; height:38px; animation-delay:-2.4s;" aria-hidden="true"></div>
  <h1>液态晨露<span class="en">LIQUID DEW · DESIGN SYSTEM</span></h1>
  <p>实验品五 — 把"水主题 UI"做成一套可交互的设计语言，而不只是一张静态图</p>
</header>

<section class="play">
  <div class="play-head">
    <h2>水滴游乐场</h2><span>点击池面生成水滴 · 水滴会呼吸与合并</span>
  </div>
  <div id="pond" role="img" aria-label="可交互的水滴池塘"></div>
</section>

<section class="tokens">
  <h2>设计 Tokens</h2>
  <div class="token-grid" id="tokenGrid"></div>
</section>

<aside class="dew-card" aria-label="个人介绍">
  <div class="who">
    <div class="avatar">💧</div>
    <div><h3>QT新月 · 钟文清</h3><p class="role">AI / 数据工程 / 全栈开发</p></div>
  </div>
  <p class="bio">深圳职业技术大学 · 人工智能技术应用。用代码解决真实问题，重度动漫爱好者。</p>
  <div class="stats">
    <div class="stat"><b>14</b><span>实战项目</span></div>
    <div class="stat"><b>5+</b><span>数据平台</span></div>
    <div class="stat"><b>300+</b><span>广告账号</span></div>
  </div>
</aside>

<a class="back" href="/lab.html">← 返回实验室</a>
<p class="hint">💡 试试点击导航水滴：悬浮膨胀 → 点击收缩，模拟表面张力</p>

<script src="/lab/exp-04-dew.js" defer></script>
</body>
</html>

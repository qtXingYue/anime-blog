<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" role="img" aria-label="液态晨露实验缩略图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7F0"/><stop offset=".55" stop-color="#E7F1E6"/><stop offset="1" stop-color="#C7DDCB"/>
    </linearGradient>
    <radialGradient id="drop" cx=".32" cy=".26" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#E7F1E6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8EAF99" stop-opacity=".65"/>
    </radialGradient>
    <radialGradient id="leaf" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#C7DDCB"/><stop offset="1" stop-color="#8EAF99" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="880" height="550" fill="url(#bg)"/>
  <ellipse cx="620" cy="430" rx="330" ry="150" fill="url(#leaf)" filter="url(#soft)" opacity=".7"/>
  <ellipse cx="180" cy="120" rx="220" ry="110" fill="url(#leaf)" filter="url(#soft)" opacity=".5"/>
  <!-- 主水滴 -->
  <g>
    <path d="M440 118 C 440 118 330 250 330 340 A 110 110 0 0 0 550 340 C 550 250 440 118 440 118 Z" fill="url(#drop)"/>
    <ellipse cx="398" cy="300" rx="34" ry="20" fill="#fff" opacity=".8" transform="rotate(-24 398 300)"/>
    <ellipse cx="470" cy="380" rx="52" ry="26" fill="#385F4C" opacity=".12"/>
  </g>
  <!-- 小水滴 -->
  <circle cx="238" cy="392" r="44" fill="url(#drop)"/>
  <circle cx="662" cy="212" r="30" fill="url(#drop)"/>
  <circle cx="700" cy="268" r="16" fill="url(#drop)"/>
  <circle cx="196" cy="300" r="18" fill="url(#drop)"/>
  <!-- 涟漪 -->
  <g fill="none" stroke="#8EAF99" stroke-width="5" opacity=".5">
    <ellipse cx="440" cy="472" rx="150" ry="26"/>
    <ellipse cx="440" cy="472" rx="210" ry="36" opacity=".6"/>
    <ellipse cx="440" cy="472" rx="272" ry="46" opacity=".35"/>
  </g>
  <text x="60" y="92" font-family="sans-serif" font-size="40" font-weight="700" fill="#385F4C" letter-spacing="6">液态晨露</text>
  <text x="62" y="128" font-family="sans-serif" font-size="20" fill="#7F9787" letter-spacing="10">LIQUID DEW · 实验品五</text>
</svg>

function initProjectLayout() {
  // 1. 返回顶部与滚动进度条
  const btn = document.getElementById('backToTop');
  const prog = document.getElementById('scrollProgress');
  let ticking = false;
  function updateBtn() {
    if (btn) {
      if (window.scrollY > 600) btn.classList.add('visible');
      else btn.classList.remove('visible');
    }
    if (prog) {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      prog.style.width = (scrollable > 0 ? Math.min(window.scrollY / scrollable * 100, 100) : 0) + '%';
    }
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(updateBtn); ticking = true; }
  }, { passive: true });
  if (btn) {
    btn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // 2. 代码块一键复制增强
  document.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.code-block-wrapper')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    pre.parentNode.insertBefore(wrapper, pre);
    
    const header = document.createElement('div');
    header.className = 'code-block-header';
    
    // 语言推断
    let lang = 'CODE';
    const codeEl = pre.querySelector('code');
    if (codeEl) {
      const classes = codeEl.className.split(' ');
      for (const c of classes) {
        if (c.startsWith('language-')) {
          lang = c.replace('language-', '').toUpperCase();
          break;
        }
      }
    }
    
    const titleSpan = document.createElement('span');
    titleSpan.textContent = lang;
    
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'code-block-copy-btn';
    copyBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
    
    copyBtn.addEventListener('click', async () => {
      const textToCopy = pre.innerText;
      try {
        await navigator.clipboard.writeText(textToCopy);
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制';
        }, 1800);
      } catch (err) {
        copyBtn.textContent = '复制失败';
      }
    });
    
    header.appendChild(titleSpan);
    header.appendChild(copyBtn);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });

  // 3. 沉浸式图片灯箱组件
  const lightbox = document.getElementById('imageLightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxBackdrop = document.getElementById('lightboxBackdrop');

  function openLightbox(src, alt) {
    if (!lightbox || !lightboxImg) return;
    lightboxImg.src = src;
    lightboxImg.alt = alt || '大图预览';
    lightbox.classList.add('active');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  if (lightbox) {
    document.querySelectorAll('.screenshot img, .gallery-card-img, .card-grid img, table img, .container img').forEach(img => {
      if (img.closest('.site-header') || img.closest('.brand')) return;
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', (e) => {
        e.preventDefault();
        openLightbox(img.currentSrc || img.src, img.alt);
      });
    });

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightboxBackdrop) lightboxBackdrop.addEventListener('click', closeLightbox);
    
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });
  }
}

document.addEventListener('astro:page-load', initProjectLayout);
initProjectLayout();
</script> </body> </html>  <script>
// ============================================================
// IMAGE DATA — add entries here

// ============================================================
const IMAGES = [
  {
    file: "/projects/ai-images/clipboard-2026-06-02T12-50-08-313Z-ab85d630.jpg",
    title: "思乐智美容仪 · 萌系广告",
    category: "img2img",
    prompt: "粉色毛绒玩偶 mascot 手持美容仪产品，漫画风格爆炸对话框，绿色清新配色，电商广告海报设计，可爱卡通风格，高饱和度，商业摄影质感",
    tags: ["产品广告", "萌系", "商业设计"],
    date: "2026-06"
  },
  {
    file: "/projects/ai-images/comfyui-00009.webp",
    title: "ComfyUI 文生图 #1",
    category: "txt2img",
    prompt: "通过 ComfyUI 工作流进行文生图创作，AI 从文本描述生成图像",
    tags: ["ComfyUI", "文生图", "文本到图像"],
    date: "2026-06"
  },
  {
    file: "/projects/ai-images/comfyui-00011.webp",
    title: "ComfyUI 文生图 #2",
    category: "txt2img",
    prompt: "通过 ComfyUI 工作流进行文生图创作，AI 从文本描述生成图像",
    tags: ["ComfyUI", "文生图", "文本到图像"],
    date: "2026-06"
  },
  {
    file: "/projects/ai-images/comfyui-00012.webp",
    title: "ComfyUI 文生图 #3",
    category: "txt2img",
    prompt: "通过 ComfyUI 工作流进行文生图创作，AI 从文本描述生成图像",
    tags: ["ComfyUI", "文生图", "文本到图像"],
    date: "2026-06"
  },
  {
    file: "/projects/ai-images/comfyui-00028.webp",
    title: "ComfyUI 文生图 #4",
    category: "txt2img",
    prompt: "通过 ComfyUI 工作流进行文生图创作，AI 从文本描述生成图像",
    tags: ["ComfyUI", "文生图", "文本到图像"],
    date: "2026-06"
  }
];

// ============================================================
// RENDER
// ============================================================
let currentFilter = "all";
let lightboxIdx = 0;
let filteredImages = [];

function getFilteredImages(filter) {
  return filter === "all" ? IMAGES : IMAGES.filter(img => img.category === filter);
}

function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  const empty = document.getElementById("emptyState");
  filteredImages = getFilteredImages(currentFilter);

  if (filteredImages.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  grid.innerHTML = filteredImages.map((img, i) => `
    <div class="gallery-card" onclick="openLightbox(${i})">
      <div class="gallery-card-img-wrap">
        <img class="gallery-card-img" src="${img.file}" alt="${img.title}" loading="lazy" decoding="async"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="gallery-card-fallback" style="display:none">
          <svg viewBox="0 0 60 60" width="48" height="48"><rect width="60" height="60" rx="12" fill="oklch(25% 0.05 280)"/><text x="30" y="40" text-anchor="middle" font-size="28">🖼</text></svg>
        </div>
      </div>
      <div class="gallery-card-body">
        <h3 class="gallery-card-title">${img.title}</h3>
        <p class="gallery-card-meta">${img.date} · ${categoryLabel(img.category)}</p>
        <p class="gallery-card-prompt">${img.prompt}</p>
        ${img.tags ? `<div class="gallery-card-tags">${img.tags.map(t => `<span class="gallery-card-tag">${t}</span>`).join("")}</div>` : ""}
      </div>
    </div>
  `).join("");

  updateCounts();
}

function categoryLabel(cat) {
  const labels = { txt2img: "文生图", img2img: "图生图", other: "其他" };
  return labels[cat] || cat;
}

function updateCounts() {
  const allCount = IMAGES.length;
  const counts = { txt2img: 0, img2img: 0, other: 0 };
  IMAGES.forEach(img => {
    if (counts[img.category] !== undefined) counts[img.category]++;
  });

  document.querySelectorAll(".filter-count").forEach(el => {
    const filter = el.parentElement.dataset.filter;
    if (filter === "all") el.textContent = allCount;
    else el.textContent = counts[filter] || 0;
  });
}

// ============================================================
// FILTER LOGIC
// ============================================================
function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll(".filter-btn, .filter-nav").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === filter);
  });
  renderGallery();
}

// Filter button clicks
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => setFilter(btn.dataset.filter));
});

// Filter nav clicks
document.querySelectorAll(".filter-nav").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    setFilter(link.dataset.filter);
    document.getElementById("filterBar").scrollIntoView({ behavior: "smooth" });
  });
});

// ============================================================
// LIGHTBOX
// ============================================================
function openLightbox(idx) {
  lightboxIdx = idx;
  updateLightbox();
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}

function updateLightbox() {
  const img = filteredImages[lightboxIdx];
  if (!img) return;
  document.getElementById("lightboxImg").src = img.file;
  document.getElementById("lightboxTitle").textContent = img.title;
  document.getElementById("lightboxPrompt").textContent = img.prompt;
  document.getElementById("lightboxCounter").textContent = `${lightboxIdx + 1} / ${filteredImages.length}`;
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

function lightboxPrev() {
  lightboxIdx = (lightboxIdx - 1 + filteredImages.length) % filteredImages.length;
  updateLightbox();
}

function lightboxNext() {
  lightboxIdx = (lightboxIdx + 1) % filteredImages.length;
  updateLightbox();
}

// Lightbox overlay click
document.getElementById("lightbox").addEventListener("click", function(e) {
  if (e.target === this) closeLightbox();
});

// Keyboard navigation
document.addEventListener("keydown", function(e) {
  const lb = document.getElementById("lightbox");
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") lightboxPrev();
  if (e.key === "ArrowRight") lightboxNext();
});

// ============================================================
// INIT
// ============================================================
renderGallery();
</script>

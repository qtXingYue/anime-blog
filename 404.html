(function initAiAssistant() {
  function setup() {
    const triggerBtn = document.getElementById('aiTriggerBtn');
    const panel = document.getElementById('aiPanel');
    const closeBtn = document.getElementById('aiCloseBtn');
    const backdrop = document.getElementById('aiBackdrop');
    const form = document.getElementById('aiForm');
    const input = document.getElementById('aiInput');
    const sendBtn = document.getElementById('aiSendBtn');
    const charCount = document.getElementById('aiCharCount');
    const messages = document.getElementById('aiMessages');
    const quickPrompts = document.getElementById('aiQuickPrompts');

    if (!triggerBtn || !panel || !form || !input) return;

    let isOpen = false;
    let isSending = false;

    function openPanel() {
      isOpen = true;
      panel.classList.add('active');
      panel.setAttribute('aria-hidden', 'false');
      triggerBtn.setAttribute('aria-expanded', 'true');
      if (backdrop) backdrop.classList.add('active');
      setTimeout(() => input.focus(), 150);
    }

    function closePanel() {
      isOpen = false;
      panel.classList.remove('active');
      panel.setAttribute('aria-hidden', 'true');
      triggerBtn.setAttribute('aria-expanded', 'false');
      if (backdrop) backdrop.classList.remove('active');
    }

    triggerBtn.onclick = () => {
      if (isOpen) closePanel();
      else openPanel();
    };

    if (closeBtn) closeBtn.onclick = closePanel;
    if (backdrop) backdrop.onclick = closePanel;

    // 字数统计
    input.oninput = () => {
      if (charCount) charCount.textContent = `${input.value.length}/150`;
    };

    // 快捷标签点击直接发送
    if (quickPrompts) {
      quickPrompts.querySelectorAll('.quick-chip').forEach(chip => {
        chip.onclick = () => {
          const query = chip.getAttribute('data-query');
          if (query && !isSending) {
            input.value = query;
            if (charCount) charCount.textContent = `${query.length}/150`;
            sendMessage(query);
          }
        };
      });
    }

    // 安全转义 HTML，杜绝 XSS
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    // 在「已转义」的文本上做极简富文本：只认 [文字](链接) 与 **粗体**。
    // 链接域名受限（站内路径或 https），避免模型被注入后吐出 javascript:
    function renderRich(str) {
      let s = escapeHtml(str);
      s = s.replace(
        /\[([^\]]{1,60})\]\((\/[A-Za-z0-9\-_\/.#=%]*|https?:\/\/[^\s)]+)\)/g,
        (_m, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      );
      s = s.replace(/\*\*([^*]{1,60})\*\*/g, '<strong>$1</strong>');
      return s;
    }

    // 来源小标签：让「有据可查」看得见
    function appendSources(container, sources) {
      if (!sources || !sources.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'msg-sources';
      const label = document.createElement('span');
      label.className = 'msg-sources-label';
      label.textContent = '参考来源';
      wrap.appendChild(label);
      sources.slice(0, 4).forEach((s) => {
        const a = document.createElement('a');
        a.href = s.url || '#';
        a.textContent = s.title || '来源';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        wrap.appendChild(a);
      });
      container.appendChild(wrap);
    }

    // 添加气泡
    function appendMessage(role, text, isHtml = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message-bubble ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = role === 'assistant' ? '✦' : '我';

      const content = document.createElement('div');
      content.className = 'msg-content';
      if (isHtml) {
        content.innerHTML = text;
      } else {
        content.innerHTML = escapeHtml(text);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(content);
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
      return msgDiv;
    }

    // 发送消息（SSE 流式：先拿来源，再逐字渲染）
    async function sendMessage(text) {
      if (!text.trim() || isSending) return;
      isSending = true;
      if (sendBtn) sendBtn.disabled = true;

      appendMessage('user', text);
      input.value = '';
      if (charCount) charCount.textContent = '0/150';

      // 展现等待动效
      const loadingBubble = appendMessage('assistant', '<div class="typing-dots"><span></span><span></span><span></span></div>', true);

      // 35s 超时兜底(后端公开路径已限 30s):避免打点动画一直转到两分钟
      const controller = new AbortController();
      const abortTimer = setTimeout(() => controller.abort(), 35000);
      let bubble = null;
      let contentEl = null;
      let full = '';
      let sources = [];

      const ensureBubble = () => {
        if (bubble) return;
        loadingBubble.remove();
        bubble = appendMessage('assistant', '');
        contentEl = bubble.querySelector('.msg-content');
      };

      try {
        const res = await fetch('/api/chat/assistant/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
          body: JSON.stringify({ prompt: text.trim().slice(0, 150) }),
          signal: controller.signal
        });

        if (res.status === 429) {
          loadingBubble.remove();
          appendMessage('assistant', '提问太频繁啦，请稍等一分钟后再试哦 ☕');
          return;
        }
        if (!res.ok || !res.body) throw new Error('stream unavailable');

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let sep;
          while ((sep = buffer.indexOf('\n\n')) >= 0) {
            const chunk = buffer.slice(0, sep).trim();
            buffer = buffer.slice(sep + 2);
            if (!chunk.startsWith('data:')) continue;
            const payload = chunk.slice(5).trim();
            if (payload === '[DONE]') continue;

            let evt;
            try { evt = JSON.parse(payload); } catch (_) { continue; }

            if (evt.type === 'sources') {
              sources = evt.sources || [];
            } else if (evt.type === 'delta' && evt.text) {
              ensureBubble();
              full += evt.text;
              contentEl.innerHTML = renderRich(full);
              messages.scrollTop = messages.scrollHeight;
            }
          }
        }

        ensureBubble();
        if (!full.trim()) {
          contentEl.innerHTML = '抱歉，暂时没有拿到回答，请稍后再试一次！';
        }
        appendSources(bubble, sources);
      } catch (err) {
        if (!bubble) loadingBubble.remove();
        if (err && err.name === 'AbortError') {
          if (!bubble) appendMessage('assistant', 'AI 助手响应超时了，请稍后再试一次！');
        } else {
          // 流式不可用时退回一次性接口，保证任何环境都答得上
          try {
            const res2 = await fetch('/api/chat/assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt: text.trim().slice(0, 150) })
            });
            const data = await res2.json();
            if (!bubble) loadingBubble.remove();
            if (res2.ok && data.ok) {
              if (!bubble) appendMessage('assistant', data.reply, true);
              else { full = data.reply; contentEl.innerHTML = renderRich(full); }
            } else if (!bubble) {
              appendMessage('assistant', data.detail || '抱歉，暂时未能连通 AI 助手，请稍后再试！');
            }
          } catch (_) {
            if (!bubble) appendMessage('assistant', '网络连接出现一点小波动，欢迎直接通过页面底部的联系表单向文清留言！');
          }
        }
      } finally {
        clearTimeout(abortTimer);
        isSending = false;
        if (sendBtn) sendBtn.disabled = false;
        input.focus();
      }
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      sendMessage(input.value);
    };

    // ESC 键关闭:用 onkeydown 赋值而非 addEventListener——
    // setup 每次 SPA 导航都会重跑,addEventListener 会累积出越叠越多的监听器
    window.onkeydown = (e) => {
      if (e.key === 'Escape' && isOpen) {
        closePanel();
      }
    };
  }

  // 挂载到 astro:page-load 生命周期（Astro 5 ClientRouter）
  document.addEventListener('astro:page-load', setup);
  setup();
})();
</script> <script type="module" src="/_astro/Base.astro_astro_type_script_index_0_lang.LHrKkJpz.js"></script> </body> </html>

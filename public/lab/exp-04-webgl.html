<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星云项目宇宙 · QT新月实验室</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#060310; color:#f2eefc; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #planets { position:fixed; inset:0; pointer-events:none; z-index:5; }

  .planet { position:absolute; left:0; top:0; transform:translate(-50%,-50%); pointer-events:auto;
    cursor:pointer; padding:16px; margin:-16px; }
  .planet .orb { display:block; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #ffffff 0%, var(--c) 42%, rgba(0,0,0,0) 72%);
    box-shadow:0 0 14px 2px var(--c), 0 0 42px 6px color-mix(in srgb, var(--c) 45%, transparent);
    transition:filter .25s; }
  .planet:hover .orb, .planet.active .orb { filter:brightness(1.35) saturate(1.2); }
  .planet .halo { position:absolute; left:50%; top:50%; width:54px; height:54px; transform:translate(-50%,-50%);
    border:1px solid var(--c); border-radius:50%; opacity:0; pointer-events:none; }
  .planet.active .halo { opacity:.9; animation:haloPulse 1.6s ease-out infinite; }
  @keyframes haloPulse { 0%{transform:translate(-50%,-50%) scale(.55);opacity:.9} 100%{transform:translate(-50%,-50%) scale(1.25);opacity:0} }
  .planet .plabel { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:2px;
    font-size:12px; letter-spacing:.06em; white-space:nowrap; color:#efeaff;
    text-shadow:0 1px 8px rgba(0,0,0,.9), 0 0 12px var(--c); pointer-events:none; }

  .hud-top { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; background:linear-gradient(180deg, rgba(5,2,14,.72), rgba(5,2,14,0)); }
  .hud-top .back { color:#cfc3f5; text-decoration:none; font-size:14px; letter-spacing:.08em;
    border:1px solid rgba(190,160,255,.28); padding:8px 14px; border-radius:999px;
    background:rgba(20,10,40,.42); backdrop-filter:blur(8px); white-space:nowrap; }
  .hud-top .back:hover { border-color:rgba(210,180,255,.6); color:#fff; }
  .title-wrap { text-align:center; }
  .title-wrap h1 { font-size:19px; letter-spacing:.35em; font-weight:600; text-indent:.35em; }
  .title-wrap p { font-size:11px; color:#9d8fd0; letter-spacing:.18em; margin-top:4px; }
  .controls { display:flex; gap:8px; }
  .controls button { color:#e8defc; font-size:12.5px; letter-spacing:.06em; cursor:pointer;
    border:1px solid rgba(190,160,255,.28); padding:8px 14px; border-radius:999px;
    background:rgba(20,10,40,.42); backdrop-filter:blur(8px); white-space:nowrap; }
  .controls button:hover { border-color:rgba(210,180,255,.6); }
  .controls button.off { opacity:.45; }

  #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:12px; letter-spacing:.22em; color:#8f81bd; white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none; }

  #tip { position:fixed; z-index:20; pointer-events:none; display:none;
    background:rgba(12,6,26,.88); border:1px solid rgba(200,170,255,.35); border-radius:10px;
    padding:8px 12px; font-size:13px; letter-spacing:.05em; backdrop-filter:blur(6px);
    transform:translate(-50%,-135%); white-space:nowrap; }
  #tip small { display:block; color:#9d8fd0; font-size:11px; margin-top:2px; }

  #panel { position:fixed; z-index:30; top:0; right:0; height:100%; width:min(380px, 88vw);
    background:rgba(10,5,24,.78); backdrop-filter:blur(18px);
    border-left:1px solid rgba(200,170,255,.22); padding:64px 28px 28px;
    transform:translateX(102%); transition:transform .45s cubic-bezier(.22,.9,.28,1);
    display:flex; flex-direction:column; }
  #panel.open { transform:translateX(0); }
  #panelClose { position:absolute; top:16px; right:18px; width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(200,170,255,.3); background:transparent; color:#cfc3f5;
    font-size:20px; cursor:pointer; line-height:1; }
  #panelClose:hover { border-color:#fff; color:#fff; }
  #pNo { font-size:12px; letter-spacing:.3em; color:var(--pc,#c9a0f5); margin-bottom:10px; }
  #pName { font-size:25px; line-height:1.35; letter-spacing:.04em; margin-bottom:14px; }
  #pDesc { font-size:14.5px; line-height:1.9; color:#c9bde8; margin-bottom:18px; }
  #pTags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:auto; }
  #pTags span { font-size:12px; padding:6px 12px; border-radius:999px; letter-spacing:.05em;
    border:1px solid color-mix(in srgb, var(--pc,#c9a0f5) 55%, transparent);
    color:var(--pc,#c9a0f5); background:color-mix(in srgb, var(--pc,#c9a0f5) 12%, transparent); }
  .panel-nav { display:flex; gap:10px; margin-top:26px; }
  .panel-nav button { flex:1; padding:12px; border-radius:12px; cursor:pointer; font-size:13.5px; letter-spacing:.1em;
    border:1px solid rgba(200,170,255,.3); background:rgba(30,16,60,.5); color:#e8defc; }
  .panel-nav button:hover { border-color:#fff; }

  #nogl { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:#060310; color:#cfc3f5; font-size:15px; letter-spacing:.1em; text-align:center; padding:24px; }

  @media (max-width:768px) {
    .hud-top { padding:10px 12px; }
    .title-wrap { display:none; }
    .hud-top .back { padding:7px 12px; font-size:12.5px; }
    .controls button { padding:7px 10px; font-size:11.5px; }
    #panel { top:auto; bottom:0; left:0; right:0; width:100%; height:auto; max-height:62vh;
      border-left:none; border-top:1px solid rgba(200,170,255,.22); border-radius:20px 20px 0 0;
      transform:translateY(105%); padding:26px 24px calc(24px + env(safe-area-inset-bottom)); }
    #panel.open { transform:translateY(0); }
    .planet .plabel { font-size:11px; }
    #hint { font-size:11px; bottom:12px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="planets"></div>

<header class="hud-top">
  <a class="back" href="../lab.html">← 实验室</a>
  <div class="title-wrap">
    <h1>星云项目宇宙</h1>
    <p>9 个项目化作星球 · 在星云中运行</p>
  </div>
  <div class="controls">
    <button id="themeBtn">🎨 <span id="themeName">紫金星云</span></button>
    <button id="rotBtn">视角旋转 · 开</button>
  </div>
</header>

<div id="hint">拖拽旋转视角 · 点击星球查看项目</div>
<div id="tip"></div>

<aside id="panel" aria-hidden="true">
  <button id="panelClose" aria-label="关闭">×</button>
  <p id="pNo">01 / 09</p>
  <h2 id="pName"></h2>
  <p id="pDesc"></p>
  <div id="pTags"></div>
  <div class="panel-nav">
    <button id="prevBtn">← 上一个</button>
    <button id="nextBtn">下一个 →</button>
  </div>
</aside>

<div id="nogl"><p>当前浏览器不支持 WebGL<br>换个现代浏览器来看看这片星云吧</p></div>

<script src="exp-04-webgl.js?v=20261013u"></script>
</body>
</html>

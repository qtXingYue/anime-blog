<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水珠实验室 · QT新月</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(165deg, #f6fcf9 0%, #e6f6ee 42%, #d3edde 100%);
    color:#14402f; overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; }
  .b1 { width:52vmax; height:52vmax; left:-12vmax; top:-14vmax;
    background:radial-gradient(circle, #bfe9d2, transparent 65%); animation:drift1 26s ease-in-out infinite alternate; }
  .b2 { width:44vmax; height:44vmax; right:-10vmax; top:22vh;
    background:radial-gradient(circle, #a5dfc0, transparent 65%); animation:drift2 32s ease-in-out infinite alternate; }
  .b3 { width:40vmax; height:40vmax; left:28vw; bottom:-16vmax;
    background:radial-gradient(circle, #d6f2e3, transparent 65%); animation:drift1 38s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform:translate(6vmax, 4vmax) scale(1.12); } }
  @keyframes drift2 { to { transform:translate(-5vmax, -6vmax) scale(1.08); } }

  #bubbles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .bubble { position:absolute; bottom:-34px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.85), rgba(205,240,222,.28) 60%);
    box-shadow:inset 1px 2px 5px rgba(255,255,255,.65), 0 0 8px rgba(150,215,180,.35);
    animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-112vh); } }

  #stage { position:fixed; inset:0; z-index:5; }
  .drop { position:absolute; left:0; top:0; --d:.5; cursor:pointer;
    transform:translate(calc(-50% + var(--px,0px)*var(--d)), calc(-50% + var(--py,0px)*var(--d))); }
  .bob { animation:bob 7s ease-in-out infinite; display:flex; flex-direction:column; align-items:center; }
  @keyframes bob { 0%,100% { transform:translateY(-9px); } 50% { transform:translateY(11px); } }
  .orb { position:relative; border-radius:50%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.18) 20%, transparent 42%),
      radial-gradient(circle at 74% 80%, rgba(110,185,145,.38) 0%, transparent 46%),
      radial-gradient(circle at 50% 52%, rgba(228,249,238,.66) 0%, rgba(172,226,196,.5) 58%, rgba(128,203,168,.6) 100%);
    box-shadow:
      inset 3px 5px 12px rgba(255,255,255,.75),
      inset -7px -11px 20px rgba(64,150,112,.32),
      0 12px 34px rgba(96,190,142,.38),
      0 2px 8px rgba(96,190,142,.28);
    transition:transform .25s;
  }
  .orb::after { content:''; position:absolute; left:21%; top:12%; width:27%; height:15%;
    border-radius:50%; transform:rotate(-24deg);
    background:radial-gradient(ellipse, rgba(255,255,255,.95), transparent 70%); }
  .drop:hover .orb, .drop.active .orb { transform:scale(1.1); }
  .drop.active .orb { box-shadow:
      inset 3px 5px 12px rgba(255,255,255,.8),
      inset -7px -11px 20px rgba(64,150,112,.32),
      0 0 0 3px rgba(80,180,135,.55), 0 12px 40px rgba(96,190,142,.55); }
  .dlabel { margin-top:10px; font-size:13.5px; letter-spacing:.08em; color:#1d5c43; font-weight:500;
    text-shadow:0 1px 0 rgba(255,255,255,.7); white-space:nowrap; }
  .dlabel small { display:block; text-align:center; font-size:10.5px; color:#6d9c87; font-weight:400; margin-top:2px; letter-spacing:.12em; }

  .ripple { position:fixed; z-index:8; border-radius:50%; pointer-events:none;
    border:2px solid rgba(80,180,135,.75); animation:rip 1.1s ease-out forwards; }
  @keyframes rip { from { transform:translate(-50%,-50%) scale(.25); opacity:.95; }
    to { transform:translate(-50%,-50%) scale(2.6); opacity:0; } }

  .hud-top { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px; }
  .hud-top .back { color:#2c6b52; text-decoration:none; font-size:14px; letter-spacing:.08em;
    border:1px solid rgba(70,160,120,.35); padding:8px 15px; border-radius:999px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(10px); }
  .title-wrap { text-align:center; }
  .title-wrap h1 { font-size:19px; letter-spacing:.32em; text-indent:.32em; font-weight:600; color:#14402f; }
  .title-wrap p { font-size:11px; color:#6d9c87; letter-spacing:.24em; margin-top:4px; }
  .pill { font-size:12.5px; color:#2c6b52; letter-spacing:.06em;
    border:1px solid rgba(70,160,120,.35); padding:8px 15px; border-radius:999px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(10px); }

  #hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:12px; letter-spacing:.26em; color:#5d8f78; white-space:nowrap; pointer-events:none; }

  #panel { position:fixed; z-index:30; top:50%; right:26px; width:min(360px, 86vw);
    transform:translateY(-50%) translateX(calc(100% + 40px)); transition:transform .5s cubic-bezier(.22,.9,.28,1);
    background:rgba(255,255,255,.72); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(130,205,170,.45); border-radius:28px; padding:30px 28px;
    box-shadow:0 24px 70px rgba(90,170,130,.28); }
  #panel.open { transform:translateY(-50%) translateX(0); }
  #panelClose { position:absolute; top:14px; right:16px; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(70,160,120,.35); background:rgba(255,255,255,.6); color:#2c6b52;
    font-size:19px; cursor:pointer; line-height:1; }
  .p-drop { width:64px; height:64px; border-radius:50%; margin-bottom:16px;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0%, transparent 42%),
      radial-gradient(circle at 50% 52%, var(--pc,#8fd0ae) 0%, rgba(255,255,255,.4) 100%);
    box-shadow:inset 2px 4px 8px rgba(255,255,255,.8), inset -4px -6px 12px rgba(64,150,112,.3),
      0 8px 24px color-mix(in srgb, var(--pc,#8fd0ae) 45%, transparent); }
  #pNo { font-size:11.5px; letter-spacing:.3em; color:#6d9c87; margin-bottom:8px; }
  #pName { font-size:23px; letter-spacing:.03em; margin-bottom:6px; color:#123c2c; }
  #pEn { font-size:12px; letter-spacing:.14em; color:#7fa892; margin-bottom:14px; }
  #pDesc { font-size:14px; line-height:1.9; color:#3d6b57; margin-bottom:18px; }
  #pTags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  #pTags span { font-size:12px; padding:6px 13px; border-radius:999px; letter-spacing:.05em;
    color:#237a58; background:rgba(64,160,116,.12); border:1px solid rgba(64,160,116,.3); }
  .panel-nav { display:flex; gap:10px; }
  .panel-nav button { flex:1; padding:12px; border-radius:14px; cursor:pointer; font-size:13.5px; letter-spacing:.1em;
    border:1px solid rgba(70,160,120,.35); background:rgba(255,255,255,.65); color:#1d5c43; }
  .panel-nav button:hover { background:#e7f6ee; }

  #nogl { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:#eaf7f0; color:#2c6b52; font-size:15px; text-align:center; padding:24px; }

  @media (max-width:768px) {
    .title-wrap { display:none; }
    #panel { top:auto; bottom:0; left:0; right:0; width:100%; border-radius:26px 26px 0 0;
      transform:translateY(105%); padding:26px 24px calc(26px + env(safe-area-inset-bottom)); }
    #panel.open { transform:translateY(0); }
    .dlabel { font-size:12px; }
    #hint { font-size:11px; }
  }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="bubbles"></div>
<main id="stage"></main>

<header class="hud-top">
  <a class="back" href="../lab.html">← 实验室</a>
  <div class="title-wrap">
    <h1>水珠实验室</h1>
    <p>9 个项目 · 化作水珠</p>
  </div>
  <span class="pill">DROPLET LAB</span>
</header>

<div id="hint">点击水珠 · 查看项目</div>

<aside id="panel" aria-hidden="true">
  <button id="panelClose" aria-label="关闭">×</button>
  <div class="p-drop" id="pDrop"></div>
  <p id="pNo">01 / 09</p>
  <h2 id="pName"></h2>
  <p id="pEn"></p>
  <p id="pDesc"></p>
  <div id="pTags"></div>
  <div class="panel-nav">
    <button id="prevBtn">← 上一个</button>
    <button id="nextBtn">下一个 →</button>
  </div>
</aside>

<div id="nogl"><p>需要现代浏览器来呈现水珠效果</p></div>

<script src="exp-04-webgl.js?v=20261013w"></script>
</body>
</html>

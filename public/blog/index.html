<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 — QT新月（钟文清）</title>
<meta name="description" content="QT新月的博客，技术分享与生活记录。">
<!-- 防 FOUC：与 index.html 保持一致的提前主题判定 -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/common.css">
<style>
/* blog.html 专属样式（tokens/reset/header/footer/noise 已移至 assets/common.css） */
:root { --content-max: 900px; }  /* 博客用更窄的阅读宽度 */

.page-hero { padding-block:calc(var(--header-h) + 3rem) 1.5rem; text-align:center; }
.page-hero h1 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:2.5rem; }
.page-hero p { color:var(--text-secondary); font-size:0.875rem; margin-top:0.5rem; }

.article-list { padding-bottom:5rem; }
.article-card {
  background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border); border-radius:16px; padding:1.5rem 2rem; margin-bottom:1rem;
  cursor:pointer; transition:all 300ms var(--ease-out-expo); display:block; text-align:left;
  width:100%; color:inherit; box-shadow:var(--shadow-lift);
}
.article-card:hover { border-color:oklch(60% 0.18 280 / 0.4); box-shadow:var(--shadow-tilt), var(--ring-accent); }
.article-date { font-size:0.75rem; color:var(--gold); margin-bottom:0.25rem; }
.article-title { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:1.25rem; background:linear-gradient(135deg, var(--text-primary), var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.article-excerpt { font-size:0.875rem; color:var(--text-secondary); margin-top:0.5rem; line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.article-readmore { font-size:0.75rem; color:var(--accent); margin-top:0.75rem; }

.article-detail { display:none; padding-bottom:5rem; }
.article-detail.open { display:block; }
.article-detail h1 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:2rem; margin-bottom:0.5rem; color:var(--text-primary); }
.article-detail .meta { font-size:0.75rem; color:var(--gold); margin-bottom:2rem; }
.article-detail .body { line-height:2; color:var(--text-secondary); }
.article-detail .body h2,.article-detail .body h3 { color:var(--text-primary); margin-top:1.5rem; margin-bottom:0.5rem; }
.article-detail .body p { margin-bottom:1rem; }
.article-detail .body img { max-width:100%; border-radius:8px; margin:1rem 0; }
.article-detail .body pre { background:var(--bg-high); padding:1rem; border-radius:8px; overflow-x:auto; }
.article-detail .body code { background:oklch(60% 0.18 280 / 0.1); padding:0.125rem 0.375rem; border-radius:4px; font-size:0.9em; }
.article-detail .body blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:1rem; color:var(--text-muted); }

.back-btn {
  display:inline-flex; align-items:center; gap:0.25rem; font-size:0.875rem; color:var(--accent);
  padding:0.5rem 1rem; border:1px solid var(--accent-dim); border-radius:100px;
  cursor:pointer; transition:all 200ms; margin-bottom:2rem; background:none;
}
.back-btn:hover { background:var(--accent-dim); color:#fff; }

.loading { text-align:center; padding:3rem; color:var(--text-muted); }
.empty { text-align:center; padding:5rem 2rem; }
.empty-icon { font-size:3rem; margin-bottom:1rem; opacity:0.5; }
.empty h3 { color:var(--text-muted); font-family:'Zen Old Mincho',serif; font-size:1.5rem; margin-bottom:0.5rem; }
.empty p { color:var(--text-muted); font-size:0.875rem; }

.footer-links { display:flex; justify-content:center; gap:1.5rem; margin-top:1rem; }
.footer-links a { font-size:0.75rem; color:var(--text-muted); }

@media (max-width:640px) {
  .article-card { padding:1rem 1.25rem; }
  .article-title { font-size:1.1rem; }
  .article-detail h1 { font-size:1.5rem; }
}
</style>
</head>
<body>
<div class="noise-overlay" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand"><span class="brand-mark">月</span><span>QT新月</span></a>
    <a href="/" style="font-size:0.875rem;color:var(--text-secondary);">← 回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>博客</h1>
    <p>技术笔记 · 生活随笔 · 创作记录</p>
  </div>
</section>

<div class="container">
  <!-- Article List -->
  <div class="article-list" id="articleList">
    <div class="loading">加载中...</div>
  </div>

  <!-- Article Detail -->
  <div class="article-detail" id="articleDetail">
    <button class="back-btn" type="button">← 返回列表</button>
    <div id="articleContent"></div>
  </div>
</div>

<footer class="site-footer">
  <p class="footer-decor">新 · 月 · 博 · 客</p>
  <div class="footer-links">
    <a href="/">回主页</a>
    <a href="https://github.com/qtXingYue" target="_blank" rel="noopener">GitHub</a>
    <a href="admin">管理后台</a>
  </div>
  <p style="margin-top:1rem">&copy; 2026 QT新月</p>
</footer>

<script>
const BASE = window.location.origin;

// HTML 转义：防止文章标题/摘要里的特殊字符破坏结构或触发 XSS
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadArticles() {
  const list = document.getElementById('articleList');
  try {
    const resp = await fetch(BASE + '/api/articles');
    const articles = await resp.json();

    if (!articles.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📝</div>
          <h3>还没有文章</h3>
          <p>去 <a href="admin">管理后台</a> 写第一篇文章吧</p>
        </div>`;
      return;
    }

    // 用 DOM API 创建卡片，避免 onclick 拼接 slug 的注入风险
    list.innerHTML = '';
    articles.forEach(a => {
      const card = document.createElement('article');
      card.className = 'article-card glass-tilt';
      card.dataset.slug = a.slug;   // slug 存在属性里，不拼进 HTML
      card.innerHTML =
        `<div class="article-date">${escapeHtml(a.created_at?.slice(0,10))}</div>` +
        `<h2 class="article-title">${escapeHtml(a.title)}</h2>` +
        (a.excerpt ? `<p class="article-excerpt">${escapeHtml(a.excerpt)}</p>` : '') +
        `<div class="article-readmore">阅读全文 →</div>`;
      list.appendChild(card);
    });
  } catch(e) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>加载失败</h3><p>后端服务可能未启动</p></div>`;
  }
}

async function loadArticle(slug) {
  try {
    // encodeURIComponent 防止 slug 被构造为路径穿越
    const resp = await fetch(BASE + '/api/articles/' + encodeURIComponent(slug));
    const a = await resp.json();
    document.getElementById('articleList').style.display = 'none';
    document.getElementById('articleDetail').classList.add('open');
    document.getElementById('articleContent').innerHTML =
      `<h1>${escapeHtml(a.title)}</h1>` +
      `<div class="meta">${escapeHtml(a.created_at?.slice(0,10))} · ${escapeHtml(a.created_at?.slice(11,16) || '')}</div>`;
    // content 为受信任的 HTML（仅管理员可发布），用 DOMPurify-style 清理过于重；
    // 这里采用 sandbox：关闭 script/事件处理。如需更强约束可在后端入库时 sanitize。
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = a.content;
    body.querySelectorAll('script, iframe, object, embed, [onload], [onerror], [onclick]').forEach(el => el.remove());
    document.getElementById('articleContent').appendChild(body);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    alert('文章加载失败');
  }
}

function backToList() {
  document.getElementById('articleDetail').classList.remove('open');
  document.getElementById('articleList').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 事件委托：列表点击统一处理，避免给每张卡绑 onclick
document.getElementById('articleList').addEventListener('click', function(e) {
  const card = e.target.closest('.article-card');
  if (!card) return;
  loadArticle(card.dataset.slug);
});

// 返回按钮（移除 inline onclick）
document.getElementById('articleDetail').addEventListener('click', function(e) {
  if (e.target.closest('.back-btn')) backToList();
});

// ============================================================
// 玻璃深化交互：鼠标光晕 · 3D Tilt（卡片为动态生成，渲染后绑定）
// 触屏 / prefers-reduced-motion 下自动禁用
// ============================================================
function bindTilt(scope) {
  const MAX_TILT = 8;
  scope.querySelectorAll('.glass-tilt:not([data-tilt])').forEach(card => {
    card.dataset.tilt = '1';
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      card.style.transform = `perspective(800px) rotateX(${-(py - 0.5) * 2 * MAX_TILT}deg) rotateY(${(px - 0.5) * 2 * MAX_TILT}deg) translateY(-4px)`;
      card.style.setProperty('--gx', px * 100 + '%');
      card.style.setProperty('--gy', py * 100 + '%');
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  });
}

(function () {
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  if (reducedMotion || coarse) return;

  // 全局鼠标光晕
  let rafId = null;
  window.addEventListener('pointermove', (e) => {
    const mx = (e.clientX / window.innerWidth) * 100;
    const my = (e.clientY / window.innerHeight) * 100;
    if (!rafId) {
      rafId = requestAnimationFrame(() => {
        document.body.style.setProperty('--mx', mx + '%');
        document.body.style.setProperty('--my', my + '%');
        rafId = null;
      });
    }
  }, { passive: true });

  // 卡片渲染完成后绑定 tilt
  loadArticles().then(() => bindTilt(document));
})();
</script>
</body>
</html>

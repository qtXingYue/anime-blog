name: Build & Deploy

# 部署流程：
#   1. 源码推送到 `astro` 分支（或手动触发）→ 本工作流构建静态站
#   2. 构建产物提交并推送到 `astro-refactor` 分支
#   3. 服务器 crontab 每分钟 git fetch origin main && merge astro-refactor，
#      内容以 astro-refactor 为准 → 一分钟后线上生效
on:
  push:
    branches: [astro]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Deploy to astro-refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin astro-refactor:refs/remotes/origin/astro-refactor
          git checkout -B astro-refactor origin/astro-refactor
          # 清空旧产物（保留 .git/.gitignore/node_modules），再放入新构建
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.gitignore' ! -name 'node_modules' \
            -exec rm -rf {} +
          cp -r dist/. .
          rm -rf dist node_modules
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to deploy"
          else
            git commit -m "deploy: build $(date -u +'%Y%m%d-%H%M%S')"
            git push origin astro-refactor
          fi

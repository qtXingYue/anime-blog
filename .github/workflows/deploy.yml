name: Build & Deploy (Cloudflare Pages)

# 部署流程（2026-11-02 起，替代旧的「推 main + 服务器 cron 拉取」）：
#   1. 源码推送到 `astro` 分支（或手动触发）→ 本工作流构建静态站
#   2. 构建产物 dist/ 与仓库 cloudflare/ 覆盖层（后端 Functions、绑定配置、后台页）
#      合并为一个部署包，用 Wrangler 发布到 Cloudflare Pages 项目 qtxingyue
#   3. qtxingyue.me / www 已绑在该 Pages 项目上，发布后约十秒生效
# 注意：
#   - main 分支已冻结（旧服务器 2026-11-05 到期），不要再往 main 推产物。
#   - cloudflare/ 目录是线上后端的命根子（/api、/admin、/uploads 都靠它），勿删。
#   - 需要的仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
#     未配置时发布会自动跳过（黄字警告），不会把工作流跑成红色。
#   - 回滚：在 Pages 后台 Deployments 里对旧版本点 Rollback，或 git revert 后重推。

on:
  push:
    branches: [astro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: astro

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Assemble Pages package（静态站 + 后端覆盖层）
        run: |
          mkdir -p /tmp/pages-dist
          cp -r dist/. /tmp/pages-dist/
          cp -r cloudflare/. /tmp/pages-dist/
          ls /tmp/pages-dist/functions
          test -f /tmp/pages-dist/functions/_lib/kb-data.js || { echo "缺少 functions/_lib/kb-data.js，发布中止"; exit 1; }

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: /tmp/pages-dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过发布（线上仍为上一版）"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g wrangler@4
          # 必须显式 --branch main：工作流跑在 astro 分支上，不指定会发布成预览环境、
          # 生产域名不更新（历史坑：冒烟测试因为打的是旧生产站而误判成功）。
          wrangler pages deploy . --project-name qtxingyue --branch main --commit-dirty=true
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Smoke check（验证线上域名）
        if: steps.deploy.outputs.skipped != 'true'
        run: |
          sleep 20
          curl -fsS --max-time 15 https://qtxingyue.me/ -o /dev/null
          curl -fsS --max-time 15 https://qtxingyue.me/api/articles | python3 -c "import json,sys; json.load(sys.stdin)"
          code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://qtxingyue.me/api/analytics/summary)
          test "$code" = "401" || { echo "统计接口鉴权失败: $code"; exit 1; }
          curl -fsS --max-time 15 https://qtxingyue.me/vendor/gsap.min.js -o /dev/null
          echo "SMOKE PASS"

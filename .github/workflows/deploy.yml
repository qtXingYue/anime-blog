name: Build & Deploy

# 部署流程（两分支，无 force-push、无服务器端 merge）：
#   1. 源码推送到 `astro` 分支（或手动触发）→ 本工作流构建静态站
#   2. 构建产物作为普通提交推送到 `main` 分支（main = 线上内容，历史线性）
#   3. 服务器 crontab 每分钟 git fetch origin main && git reset --hard origin/main
#      → 一分钟内线上生效
# 注意：main 上只放构建产物，源码改动一律走 `astro` 分支。
on:
  push:
    branches: [astro]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: astro

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Deploy dist to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/deploy-dist
          cp -r dist/. /tmp/deploy-dist/
          git fetch origin main
          git checkout -B deploy origin/main
          # 清空旧产物（保留 .git/.gitignore/node_modules），再放入新构建
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.gitignore' ! -name 'node_modules' \
            -exec rm -rf {} +
          cp -r /tmp/deploy-dist/. .
          rm -rf /tmp/deploy-dist node_modules
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to deploy"
          else
            git commit -m "deploy: build $(date -u +'%Y%m%d-%H%M%S')"
            git push origin deploy:main
          fi

      - name: Smoke check（等服务器 cron 拉取后验证线上）
        run: |
          sleep 70
          curl -fsS --max-time 15 https://qtxingyue.me/ -o /dev/null
          curl -fsS --max-time 15 https://qtxingyue.me/api/articles | python3 -c "import json,sys; json.load(sys.stdin)"
          code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://qtxingyue.me/api/analytics/summary)
          test "$code" = "401" || { echo "统计接口鉴权失败: $code"; exit 1; }
          curl -fsS --max-time 15 https://qtxingyue.me/vendor/gsap.min.js -o /dev/null
          echo "SMOKE PASS"
